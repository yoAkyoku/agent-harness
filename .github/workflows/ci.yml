name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: uv sync --locked
      - name: Install Tesseract for the real OCR test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Type-check
        run: uv run mypy
      - name: Check workbench JavaScript
        shell: bash
        run: for file in src/agent_harness/static/*.js; do node --check "$file"; done
      - name: Run tests
        # Every model is replaced at its HTTP transport; no API key or model is needed.
        run: uv run pytest -q
        env:
          # On Linux the real OCR test must run, not skip.
          REQUIRE_TESSERACT: ${{ runner.os == 'Linux' && '1' || '' }}

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t agent-harness .
      - name: Smoke test the fixture workbench
        env:
          AGENT_HARNESS_TOKEN: ci-smoke-token-0123456789
        run: |
          docker run -d --name harness -e AGENT_HARNESS_TOKEN -p 127.0.0.1:8787:8787 agent-harness
          for attempt in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer $AGENT_HARNESS_TOKEN" http://127.0.0.1:8787/api/config > config.json; then break; fi
            sleep 1
          done
          grep -q '"mode":"fixture"' config.json
          # Without the token the API refuses the request.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/config)" = 401
          docker rm -f harness
