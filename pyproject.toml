[project]
name = "agent-harness-demo"
version = "0.1.0"
description = "A local, observable Python agent harness workbench"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.26,<5",
    "uvicorn[standard]>=0.34,<1",
    "websockets>=13,<18",
]

[dependency-groups]
dev = ["pytest>=8,<10", "mypy>=1,<2", "types-jsonschema>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/agent_harness_demo"]
